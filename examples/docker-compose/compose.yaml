services:
  autoscaler:
    image: ${SCALESET_IMAGE:-scaleset-autoscaler:local}
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    user: "${SCALESET_UID:-10001}:${SCALESET_GID:-10001}"
    group_add:
      - "${DOCKER_GID:?Set DOCKER_GID to the group ID that can access the Docker socket}"
    environment:
      SCALESET__Controller__Identity: "${SCALESET__Controller__Identity:-scaleset-controller}"
      SCALESET__Controller__StateDirectory: /var/lib/scaleset
      SCALESET__Health__ListenUrl: http://0.0.0.0:8080
      SCALESET__ScaleSets__0__Key: "${SCALESET__ScaleSets__0__Key:-linux-x64}"
      SCALESET__ScaleSets__0__GithubUrl: "${SCALESET__ScaleSets__0__GithubUrl:?Set a GitHub repository or organization URL}"
      SCALESET__ScaleSets__0__Name: "${SCALESET__ScaleSets__0__Name:?Set a GitHub runner scale-set name}"
      SCALESET__ScaleSets__0__CredentialsRef: github
      SCALESET__ScaleSets__0__Provider: Docker
      SCALESET__ScaleSets__0__Scaling__Policy: "${SCALESET__ScaleSets__0__Scaling__Policy:-SpareCapacity}"
      SCALESET__ScaleSets__0__Scaling__MinRunners: "${SCALESET__ScaleSets__0__Scaling__MinRunners:-0}"
      SCALESET__ScaleSets__0__Scaling__MaxRunners: "${SCALESET__ScaleSets__0__Scaling__MaxRunners:-10}"
      SCALESET__ScaleSets__0__RunnerProfile__Image: "${SCALESET__ScaleSets__0__RunnerProfile__Image:?Set a pinned runner image}"
      SCALESET__ScaleSets__0__RunnerProfile__Architecture: "${SCALESET__ScaleSets__0__RunnerProfile__Architecture:-X64}"
      SCALESET__ScaleSets__0__RunnerProfile__Cpu: "${SCALESET__ScaleSets__0__RunnerProfile__Cpu:-1}"
      SCALESET__ScaleSets__0__RunnerProfile__Memory: "${SCALESET__ScaleSets__0__RunnerProfile__Memory:-2048}"
      SCALESET__Credentials__github__Pat: "${GITHUB_TOKEN:?Set GITHUB_TOKEN in the local .env file}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:?Set the configured OTLP receiver endpoint}"
      OTEL_EXPORTER_OTLP_PROTOCOL: "${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}"
      SCALESET_HEALTH_URL: http://127.0.0.1:8080/health/live
    volumes:
      - "${SCALESET_STATE_DIR:-./state}:/var/lib/scaleset"
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:${HEALTH_PORT:-8080}:8080"
    stop_grace_period: "${SCALESET_STOP_GRACE_PERIOD:-10m}"
    healthcheck:
      test: ["CMD", "dotnet", "ScaleSet.Autoscaler.dll", "health-probe"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
