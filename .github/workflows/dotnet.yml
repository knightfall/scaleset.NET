name: .NET
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Docker Compose configuration
        run: docker compose --env-file examples/docker-compose/.env.example -f examples/docker-compose/compose.yaml config --quiet
      - name: Create container-backed multi-platform builder
        run: |
          docker buildx create --name scaleset-ci --driver docker-container --use
          docker buildx inspect --bootstrap
      - name: Build Linux x64 and arm64 OCI image without publishing
        env:
          OCI_PATH: ${{ runner.temp }}/scaleset-autoscaler.oci.tar
        run: docker buildx build --platform linux/amd64,linux/arm64 --output "type=oci,dest=${OCI_PATH}" .
  foundation:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CI: true
      TESTINGPLATFORM_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore ScaleSet.slnx --locked-mode
      - name: Build with Roslynator and compiler warnings as errors
        run: dotnet build ScaleSet.slnx --configuration Release --no-restore -p:RunAnalyzersDuringBuild=true
      - name: Test solution discovery and behavior
        run: dotnet test --solution ScaleSet.slnx --configuration Release --no-build
        env:
          SCALESET_DOCKER_INTEGRATION: ${{ runner.os == 'Linux' && '1' || '0' }}
      - name: Package libraries
        if: runner.os == 'Linux'
        run: dotnet pack ScaleSet.slnx --configuration Release --no-build --output artifacts/packages
