name: .NET
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate Docker Compose configuration
        run: docker compose --env-file examples/docker-compose/.env.example -f examples/docker-compose/compose.yaml config --quiet
      - name: Build Linux x64 and arm64 OCI image without publishing
        env:
          OCI_PATH: ${{ runner.temp }}/scaleset-autoscaler.oci.tar
        run: docker buildx build --platform linux/amd64,linux/arm64 --output "type=oci,dest=${OCI_PATH}" .
  foundation:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CI: true
      TESTINGPLATFORM_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore ScaleSet.slnx
      - name: Build with analyzer warnings as errors
        run: dotnet build ScaleSet.slnx --configuration Release --no-restore
      - name: Test solution discovery and behavior
        run: dotnet test --solution ScaleSet.slnx --configuration Release --no-build
        env:
          SCALESET_DOCKER_INTEGRATION: ${{ runner.os == 'Linux' && '1' || '0' }}
      - name: Package libraries
        if: runner.os == 'Linux'
        run: dotnet pack ScaleSet.slnx --configuration Release --no-build --output artifacts/packages
