name: Workflow security

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: workflow-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Workflow security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify action pins, actionlint, and zizmor
        run: python3 .github/security/verify-workflows.py --cache "$RUNNER_TEMP/workflow-tools"
