name: Package release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified 0.1.0-alpha.1 candidate (requires production approval)
        type: boolean
        default: false
      candidate_run_id:
        description: Optional successful Package release run on main for this exact commit; reuse its candidate artifact and skip rebuilding
        type: string
        required: false
        default: ''

permissions: {}

concurrency:
  group: package-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release candidate
    if: github.event_name != 'workflow_dispatch' || inputs.candidate_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      manifest_sha256: ${{ steps.manifest.outputs.sha256 }}
    env:
      CI: true
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore locked solution
        run: dotnet restore ScaleSet.slnx --locked-mode
      - name: Build solution with Roslynator and compiler warnings as errors
        run: dotnet build ScaleSet.slnx --configuration Release --no-restore -p:RunAnalyzersDuringBuild=true
      - name: Run solution tests
        run: dotnet test --solution ScaleSet.slnx --configuration Release --no-build
        env:
          SCALESET_DOCKER_INTEGRATION: '1'
      - name: Pack libraries
        run: dotnet pack ScaleSet.slnx --configuration Release --no-build --output artifacts/packages
      - name: Build the package-based worker with Roslynator
        run: |
          worker="$RUNNER_TEMP/scaleset-worker"
          mkdir -p "$worker/feed"
          cp artifacts/packages/*.nupkg "$worker/feed/"
          cp Directory.Packages.props .editorconfig examples/dotnet-worker/*.cs examples/dotnet-worker/*.csproj examples/dotnet-worker/NuGet.Local.Config "$worker/"
          dotnet restore "$worker/ScaleSet.Worker.Example.csproj" --configfile "$worker/NuGet.Local.Config" --packages "$worker/packages"
          dotnet build "$worker/ScaleSet.Worker.Example.csproj" --configuration Release --no-restore -p:RunAnalyzersDuringBuild=true
      - name: Run the package-based custom provider with Roslynator
        run: |
          worker="$RUNNER_TEMP/scaleset-custom-provider"
          mkdir -p "$worker/feed"
          cp artifacts/packages/*.nupkg "$worker/feed/"
          cp Directory.Packages.props .editorconfig examples/custom-provider-worker/*.cs examples/custom-provider-worker/*.csproj examples/custom-provider-worker/NuGet.Local.Config "$worker/"
          dotnet restore "$worker/ScaleSet.CustomProvider.Example.csproj" --configfile "$worker/NuGet.Local.Config" --packages "$worker/packages"
          python3 - "$worker/obj/project.assets.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          libraries = json.loads(Path(sys.argv[1]).read_text())["libraries"]
          unexpected = [name for name in libraries if name.startswith(("Knightfall.ScaleSet.Providers.Docker/", "OpenTelemetry.", "Serilog."))]
          if unexpected:
              raise SystemExit(f"Unexpected provider or telemetry dependencies: {unexpected}")
          PY
          dotnet build "$worker/ScaleSet.CustomProvider.Example.csproj" --configuration Release --no-restore -p:RunAnalyzersDuringBuild=true
          dotnet run --project "$worker/ScaleSet.CustomProvider.Example.csproj" --configuration Release --no-build
      - name: Run the checkpointed listener from candidate packages
        run: |
          consumer="$RUNNER_TEMP/scaleset-checkpointed-listener"
          mkdir -p "$consumer/feed"
          cp artifacts/packages/Knightfall.ScaleSet.Client.*.nupkg artifacts/packages/Knightfall.ScaleSet.Listener.*.nupkg "$consumer/feed/"
          cp global.json Directory.Packages.props .editorconfig examples/checkpointed-listener/*.cs examples/checkpointed-listener/*.csproj examples/checkpointed-listener/NuGet.Local.Config "$consumer/"
          dotnet restore "$consumer/ScaleSet.CheckpointedListener.Example.csproj" --configfile "$consumer/NuGet.Local.Config" --packages "$consumer/packages" --no-http-cache
          python3 - "$consumer/obj/project.assets.json" <<'PYTHON'
          import json
          import sys
          from pathlib import Path

          libraries = json.loads(Path(sys.argv[1]).read_text())["libraries"]
          allowed_prefixes = ("Knightfall.ScaleSet.Client/", "Knightfall.ScaleSet.Listener/", "Microsoft.Extensions.", "System.Diagnostics.DiagnosticSource/", "Roslynator.Analyzers/")
          unexpected = [name for name in libraries if not name.startswith(allowed_prefixes)]
          if unexpected:
              raise SystemExit(f"Unexpected checkpointed listener dependencies: {unexpected}")
          PYTHON
          dotnet run --project "$consumer/ScaleSet.CheckpointedListener.Example.csproj" --configuration Release --no-restore
      - name: Prepare source-bound candidate and validated SPDX SBOM
        run: python3 .github/release/prepare.py --output "$RUNNER_TEMP/release" --cache "$RUNNER_TEMP/release-tools" --packages artifacts/packages
      - name: Check actual package layouts and manifest integrity
        run: python3 .github/release/check-candidate.py "$RUNNER_TEMP/release"
        env:
          RELEASE_EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify NuGet package and symbol retry behavior on loopback
        run: python3 .github/release/check-push-retry.py "$RUNNER_TEMP/release"
      - name: Run the external consumer against the candidate before publication
        run: python3 .github/release/verify-published.py --registry candidate --release-directory "$RUNNER_TEMP/release"
      - name: Record manifest digest for this run
        id: manifest
        run: echo "sha256=$(sha256sum "$RUNNER_TEMP/release/release.json" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: release-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        name: Download candidate for round-trip verification
        id: download
        continue-on-error: true
        with:
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/downloaded-release
          merge-multiple: true
      - name: Wait for the new artifact to become visible
        if: steps.download.outcome == 'failure'
        run: sleep 10
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        name: Retry the same candidate download
        if: steps.download.outcome == 'failure'
        with:
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/downloaded-release
          merge-multiple: true
      - name: Verify the downloaded manifest and complete evidence round trip
        run: |
          cmp "$RUNNER_TEMP/release/release.json" "$RUNNER_TEMP/downloaded-release/release.json"
          python3 .github/release/check-candidate.py "$RUNNER_TEMP/downloaded-release"
        env:
          RELEASE_EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

  publish:
    name: Attest and publish verified packages
    if: always() && github.event_name == 'workflow_dispatch' && inputs.publish && github.repository == 'knightfall/scaleset.NET' && github.ref == 'refs/heads/main' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.candidate_run_id != ''))
    needs: build
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      checks: read
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      RELEASE_PUBLISH: 'true'
      GH_TOKEN: ${{ github.token }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/release
            global.json
            docs/releases
          sparse-checkout-cone-mode: false
      - name: Verify protected release tag, main CI, and any reused candidate build
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: python3 .github/release/preflight.py --candidate-run-id="$CANDIDATE_RUN_ID"
      - name: Download newly built candidate artifact
        if: inputs.candidate_run_id == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: Download reused candidate artifact
        if: inputs.candidate_run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-${{ github.sha }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: Resolve manifest digest
        id: manifest
        env:
          BUILD_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
        run: |
          actual=$(sha256sum "$RUNNER_TEMP/release/release.json" | cut -d ' ' -f 1)
          if [ -n "$BUILD_MANIFEST_SHA256" ] && [ "$actual" != "$BUILD_MANIFEST_SHA256" ]; then
            echo "Downloaded release manifest digest differs from build output" >&2
            exit 1
          fi
          echo "sha256=$actual" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Verify source, package allowlist, and every artifact digest
        run: python3 .github/release/verify.py "$RUNNER_TEMP/release"
        env:
          RELEASE_MANIFEST_SHA256: ${{ steps.manifest.outputs.sha256 }}
      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/release/packages/*
            ${{ runner.temp }}/release/release.json
            ${{ runner.temp }}/release/_manifest/spdx_2.2/manifest.spdx.json
          create-storage-record: false
      - name: Attest build dependency SBOM
        id: build_sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/packages/*
          sbom-path: ${{ runner.temp }}/release/_manifest/spdx_2.2/manifest.spdx.json
          create-storage-record: false
      - name: Verify provenance and SBOM bundles and exact subjects
        run: python3 .github/release/verify-attestations.py "$RUNNER_TEMP/release"
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          BUILD_SBOM_BUNDLE: ${{ steps.build_sbom.outputs.bundle-path }}
      - name: Authenticate to NuGet using trusted publishing policy
        id: nuget
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: knightfall
      - name: Publish identical verified packages and draft release assets
        run: python3 .github/release/publish.py --release-directory "$RUNNER_TEMP/release"
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          BUILD_SBOM_BUNDLE: ${{ steps.build_sbom.outputs.bundle-path }}

  verify-published:
    name: Verify external consumption (${{ matrix.registry }})
    if: always() && github.event_name == 'workflow_dispatch' && inputs.publish && github.repository == 'knightfall/scaleset.NET' && github.ref == 'refs/heads/main' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.candidate_run_id != '')) && needs.publish.result == 'success'
    needs: [build, publish]
    strategy:
      fail-fast: false
      matrix:
        registry: [nuget, github]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/release
            global.json
          sparse-checkout-cone-mode: false
      - name: Download newly built candidate artifact
        if: inputs.candidate_run_id == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: Download reused candidate artifact
        if: inputs.candidate_run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-${{ github.sha }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Verify published package payloads and a fresh consumer
        run: python3 .github/release/verify-published.py --registry "$RELEASE_REGISTRY" --release-directory "$RUNNER_TEMP/release"
        env:
          RELEASE_REGISTRY: ${{ matrix.registry }}
          GH_TOKEN: ${{ github.token }}

  announce:
    name: Announce verified release
    if: always() && github.event_name == 'workflow_dispatch' && inputs.publish && github.repository == 'knightfall/scaleset.NET' && github.ref == 'refs/heads/main' && needs.verify-published.result == 'success'
    needs: verify-published
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/release/policy.json
          sparse-checkout-cone-mode: false
      - name: Publish release announcement after both registry consumers pass
        run: |
          tag=$(jq -er '"v" + .version' .github/release/policy.json)
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
